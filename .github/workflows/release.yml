name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-ui-quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Fixture Contract Check
        run: pnpm fixtures:check

      - name: Browser E2E
        run: pnpm e2e

      - name: Visual Regression
        run: pnpm e2e:visual

      - name: Accessibility Gate
        run: pnpm e2e:a11y

      - name: Frontend Verify
        run: pnpm verify

      - name: Upload Source UI Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: source-ui-quality-artifacts
          path: output/playwright/**

  build:
    needs: source-ui-quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            platform: windows-x86_64
            archive: msi
            ext: msi

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout chatlog_alpha sidecar source
        uses: actions/checkout@v4
        with:
          repository: zhoumeng-creater/chatlog_alpha
          ref: 5b979cc666418c41467b1f9959cfdc6b3abbb86b
          path: output/sidecar-source/chatlog_alpha

      - name: Validate updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for signed updater artifacts"
            exit 1
          fi
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required to unlock the updater signing key"
            exit 1
          fi
          if [[ -z "${TAURI_UPDATER_PUBKEY}" ]]; then
            echo "::error::TAURI_UPDATER_PUBKEY is required so the app can verify updates"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Configure updater public key
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          node -e "const fs=require('fs'); const p='src-tauri/tauri.conf.json'; const c=JSON.parse(fs.readFileSync(p,'utf8')); c.plugins.updater.pubkey=process.env.TAURI_UPDATER_PUBKEY; fs.writeFileSync(p, JSON.stringify(c,null,2)+'\n');"

      - name: Install MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-pkg-config

      - name: Verify Release Sidecar Provenance
        run: node scripts/verify-sidecar-artifacts.mjs --target "${{ matrix.target }}" --mode release

      - name: Prepare Sidecar
        shell: bash
        env:
          SIDECAR_SOURCE_DIR: output/sidecar-source/chatlog_alpha
        run: bash .github/scripts/prepare-sidecar.sh "${{ matrix.target }}" release

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Frontend
        run: pnpm verify

      - name: Tauri Build
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          VITE_ENABLE_UPDATER: "true"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "chatlog_alpha v__VERSION__"
          releaseBody: |
            更新内容请参见 CHANGELOG。
            此 workflow 默认创建草稿 release。发布前必须完成 P5-C release evidence、sidecar artifact provenance、updater manifest/signature verification、packaged smoke、and privacy audit.
            第一版候选发布仅包含 Windows x64。macOS 和 Linux 仍是 platform caveat，直到 sidecar provenance、签名/公证和平台 smoke 证据补齐。
            下载 Windows x64 安装包：
            - **Windows**: `chatlog_alpha_x64.msi` 或 `chatlog_alpha_*_x64-setup.exe`
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Verify Generated Updater Manifest
        run: node scripts/verify-updater-manifest.mjs --bundle-root src-tauri/target --required-platforms "${{ matrix.platform }}"

      - name: Upload Release Evidence Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ matrix.target }}
          path: |
            scripts/release/sidecar-artifacts.json
            src-tauri/target/**/release/bundle/**
            src-tauri/target/release/bundle/**
